<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="画像の特定の色を別の色に簡単に置換できる無料Webツール。PNG/JPEG対応、ブラウザ上で完結。">

    <!-- OGP (Open Graph Protocol) -->
    <meta property="og:title" content="カラーコード検索・置換ツール">
    <meta property="og:description" content="画像の特定の色を別の色に簡単に置換できる無料Webツール">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ja_JP">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="カラーコード検索・置換ツール">
    <meta name="twitter:description" content="画像の特定の色を別の色に簡単に置換できる無料Webツール">

    <title>カラーコード検索・置換ツール</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/output.css">
</head>
<body class="bg-white min-h-screen">
    <div class="w-full max-w-7xl mx-auto p-4 pt-4">
        <div class="flex gap-8 flex-col lg:flex-row items-start">

            <!-- 左カラム: タイトル・画像エリア・作者フッター -->
            <div class="flex-1 w-full space-y-4">
                <div id="header"></div>
                <div id="canvas-area"></div>
                <div id="footer"></div>
            </div>

            <!-- 右カラム: コントロールパネル -->
            <div class="w-full lg:w-96 space-y-4">
                <div id="mode-panel"></div>
                <div id="settings-panel"></div>
                <div id="color-panel"></div>
                <input type="checkbox" id="chainModeToggle" class="hidden">
                <div id="action-buttons"></div>
            </div>

        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>

</html>
