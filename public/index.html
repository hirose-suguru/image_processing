<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="画像の特定の色を別の色に簡単に置換できる無料Webツール。PNG/JPEG対応、ブラウザ上で完結。">

    <!-- OGP (Open Graph Protocol) -->
    <meta property="og:title" content="カラーコード検索・置換ツール">
    <meta property="og:description" content="画像の特定の色を別の色に簡単に置換できる無料Webツール">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ja_JP">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="カラーコード検索・置換ツール">
    <meta name="twitter:description" content="画像の特定の色を別の色に簡単に置換できる無料Webツール">

    <title>カラーコード検索・置換ツール</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="output.css">
</head>
<body class="bg-white min-h-screen">
    <div class="w-full max-w-7xl mx-auto p-4 pt-4">
        <!-- Main 2-Column Layout -->
        <div class="flex gap-8 flex-col lg:flex-row items-start">

            <!-- Left Column: Header + Image Preview Area -->
            <div class="flex-1 w-full space-y-4">
                <!-- Header -->
                <header class="border-b border-slate-300 flex items-center gap-4 flex-wrap justify-between" style="padding-bottom: 10px;">
                    <div class="flex items-center gap-4 flex-wrap">
                        <h1 class="font-semibold text-slate-900" style="font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 1.60rem;"
                            >カラーコード検索・置換ツール</h1>
                        <!-- File Input Button -->
                        <input type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg" class="hidden">
                        <button onclick="document.getElementById('fileInput').click()"
                                class="px-6 py-2.5 text-white rounded-lg font-medium transition-all duration-300 ease-out hover:brightness-110 hover:shadow-lg hover:-translate-y-0.5 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-offset-2"
                                style="background-color: rgba(195, 135, 1, 0.5); font-size: 1rem; text-shadow: 0 1px 1.5px rgba(0, 0, 0, 0.15);">
                            画像ファイルを選択
                        </button>
                    </div>
                    <p class="text-slate-600 text-sm bg-slate-50 px-3 py-2 rounded border border-slate-200 max-w-xs" id="infoMessage"></p>
                </header>

                <!-- Canvas Section -->
                <div class="border-2 border-dashed border-slate-200 rounded-xl min-h-[500px] flex items-center justify-center bg-slate-50 overflow-auto p-8">
                    <span class="text-slate-400 text-lg" id="placeholderText">画像を選択してください</span>
                    <canvas id="canvas" class="max-w-full max-h-[600px] cursor-crosshair hidden"></canvas>
                </div>

                <!-- Footer Info -->
                <div class="flex items-end gap-4" style="font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 1.375rem; margin-top: -4px;">
                    <div class="text-left">
                        <p class="text-slate-700">改善・修正の要望があれば DM <span style="font-size: 1.5rem;">📩</span> してください！</p>
                        <p>
                            <a href="https://x.com/hirose_suguru" target="_blank" rel="noopener noreferrer" style="color: #2563eb; text-decoration: underline;">広瀬・アーサー・傑のX</a>
                        </p>
                    </div>
                    <img src="icon_1.jpg" alt="広瀬・アーサー・傑" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;">
                </div>
            </div>

            <!-- Right Column: Control Panel -->
            <div class="w-full lg:w-96 space-y-6">
                <!-- Mode Toggles + Hamburger -->
                <div class="bg-white rounded-xl border-2 border-slate-400 p-6 space-y-3">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-semibold text-slate-900">モード設定</h2>
                        <!-- Hamburger menu button -->
                        <button id="settingsToggleBtn" onclick="toggleSettingsPanel()" class="p-1.5 rounded-lg hover:bg-slate-100 transition-colors border border-slate-300" title="詳細設定">
                            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="4" y1="6" x2="20" y2="6"/>
                                <line x1="4" y1="12" x2="20" y2="12"/>
                                <line x1="4" y1="18" x2="20" y2="18"/>
                            </svg>
                        </button>
                    </div>
                    <!-- Compact mode toggles -->
                    <div class="flex items-center gap-3 cursor-pointer" onclick="togglePinMode()">
                        <svg id="pinModeIndicator" class="flex-shrink-0" width="18" height="18" viewBox="0 0 18 18">
                            <circle cx="9" cy="9" r="7.5" fill="white" stroke="#1e293b" stroke-width="2"/>
                        </svg>
                        <span class="text-sm text-slate-700">ピンモード</span>
                        <span class="text-xs text-slate-400 ml-auto" id="pinModeStatus"></span>
                    </div>
                    <div class="flex items-center gap-3 cursor-pointer" onclick="toggleChainMode()">
                        <svg id="chainModeIndicator" class="flex-shrink-0" width="18" height="18" viewBox="0 0 18 18">
                            <circle cx="9" cy="9" r="7.5" fill="white" stroke="#1e293b" stroke-width="2"/>
                        </svg>
                        <span class="text-sm text-slate-700">連鎖モード</span>
                    </div>
                </div>

                <!-- Settings Panel (hidden by default, toggled by hamburger) -->
                <div id="settingsPanel" class="bg-white rounded-xl border-2 border-slate-400 p-6 space-y-4" style="display: none;">
                    <h3 class="text-sm font-semibold text-slate-900">詳細設定</h3>
                    <!-- Pin mode settings -->
                    <div class="space-y-2">
                        <p class="text-xs font-medium text-slate-700">ピンモード</p>
                        <p class="text-xs text-slate-500">画像上をクリックしてピンを配置。ピンから連結した同色領域のみ置換されます。</p>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-slate-700">境界しきい値:</span>
                            <input type="range" id="boundaryThreshold" min="10" max="100" value="30"
                                   class="flex-1 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"
                                   style="accent-color: rgba(0, 135, 196, 0.7);">
                            <span class="text-xs font-mono text-slate-600" id="thresholdValue">30</span>
                        </div>
                        <div id="pinInfo" class="text-xs text-slate-500">ピン未配置</div>
                    </div>
                    <div class="border-b border-slate-200"></div>
                    <!-- Chain mode settings -->
                    <div class="space-y-2">
                        <p class="text-xs font-medium text-slate-700">連鎖変換モード</p>
                        <p class="text-xs text-slate-500">ONの場合、置換後に「クリックした色」が自動的に新しい色に更新されます</p>
                    </div>
                </div>

                <!-- Color Info Section: カラー設定パネル全体 -->
                <!-- padding-top: 枠線からヘッダーまでの距離を調整 -->
                <div class="bg-white rounded-xl border-2 border-slate-400 p-6 space-y-6" style="padding-top: 14px;">
                    <!-- margin-bottom: ヘッダーと下の要素の間隔を調整 -->
                    <h2 class="text-lg font-semibold text-slate-900" style="margin-bottom: 2px;">カラー設定</h2>

                    <!-- Selected Color: 画像クリックで取得した色（置換元）の表示 -->
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-700">クリックした色</label>
                        <div class="flex items-center gap-3">
                            <!-- selectedColorSample: JS から背景色を動的に更新 -->
                            <div class="w-16 h-16 rounded-lg border-2 border-slate-300 flex-shrink-0" id="selectedColorSample" style="background: #ffffff;"></div>
                            <div class="space-y-1 flex-1">
                                <div class="font-mono text-sm bg-slate-50 px-3 py-2 rounded border border-slate-200" id="selectedColorHex">#000000</div>
                                <div class="font-mono text-sm text-slate-500 px-3" id="selectedColorRgb">RGB(0, 0, 0)</div>
                            </div>
                        </div>
                    </div>

                    <!-- 区切り線: margin-bottom で「新しい色」ラベルとの距離を調整 -->
                    <div class="border-b border-slate-300" style="margin-left: 10px; margin-right: 10px; margin-bottom: 3px;"></div>

                    <!-- New Color: 置換先の色を指定するカラーピッカー＋テキスト入力 -->
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-700">新しい色</label>
                        <div class="flex items-center gap-3">
                            <!-- colorPicker: ブラウザネイティブのカラーピッカー、newColorInput と双方向同期 -->
                            <input type="color" id="colorPicker" value="#FF0000"
                                   class="w-16 h-16 rounded-lg border-2 border-slate-300 cursor-pointer">
                            <div class="space-y-1 flex-1">
                                <!-- newColorInput: #RRGGBB 形式の直接入力、colorPicker と双方向同期 -->
                                <input type="text" id="newColorInput" placeholder="#FF0000" value="#FF0000" maxlength="7"
                                       class="w-full font-mono text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-all duration-300">
                                <div class="font-mono text-sm text-slate-500 px-3" id="newColorRgb">RGB(255, 0, 0)</div>
                            </div>
                        </div>
                    </div>

                    <!-- Alpha Setting: 置換色の透過度を 0（完全透明）〜 255（不透明）で指定 -->
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-700">透過性</label>
                        <input type="range" id="alphaSlider" min="0" max="255" value="255"
                               class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"
                               style="accent-color: rgba(0,135, 196, 0.7);">
                        <div class="font-mono text-xs text-slate-600 text-center bg-slate-50 px-3 py-2 rounded" id="alphaValue">255 (不透明)</div>
                        <!-- newColorSample: 新しい色＋透過度を反映したプレビュー -->
                        <div class="w-full h-10 rounded-lg border-slate-300 checkerboard-bg" id="newColorSample" style="background: #FF0000; border-width: 3px;"></div>
                    </div>
                </div>

                <!-- Hidden elements for JS compatibility -->
                <input type="checkbox" id="chainModeToggle" class="hidden">

                <!-- Button Section -->
                <div class="flex gap-2">
                    <button id="replaceBtn" onclick="replaceColor()" disabled
                            class="flex-1 px-2 py-2.5 text-white rounded-lg font-medium transition-all duration-300 ease-out hover:opacity-90 hover:shadow-lg active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:shadow-none disabled:hover:scale-100"
                            style="background-color: rgba(0, 135, 196, 0.7); font-size: 1rem; text-shadow: 0 1px 1.5px rgba(0, 0, 0, 0.15);">
                        カラー置換
                    </button>
                    <button id="transparentBtn" onclick="makeTransparent()" disabled
                            class="flex-1 px-2 py-2.5 text-white rounded-lg font-medium transition-all duration-300 ease-out hover:opacity-90 hover:shadow-lg active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:shadow-none disabled:hover:scale-100"
                            style="background-color: rgba(139, 92, 246, 0.7); font-size: 1rem; text-shadow: 0 1px 1.5px rgba(0, 0, 0, 0.15);">
                        透過化
                    </button>
                    <button id="copyBtn" onclick="copyToClipboard()" disabled
                            class="flex-1 px-2 py-2.5 border border-slate-400 text-slate-700 rounded-lg font-medium transition-all duration-300 hover:bg-slate-50 hover:border-slate-500 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:scale-100"
                            style="font-size: 1rem;">
                        コピー
                    </button>
                    <button id="downloadBtn" onclick="downloadImage()" disabled
                            class="flex-1 px-2 py-2.5 border border-slate-400 text-slate-700 rounded-lg font-medium transition-all duration-300 hover:bg-slate-50 hover:border-slate-500 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:scale-100"
                            style="font-size: 1rem;">
                        ダウンロード
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('fileInput');
        const placeholderText = document.getElementById('placeholderText');
        const selectedColorSample = document.getElementById('selectedColorSample');
        const selectedColorHex = document.getElementById('selectedColorHex');
        const selectedColorRgb = document.getElementById('selectedColorRgb');
        const newColorInput = document.getElementById('newColorInput');
        const colorPicker = document.getElementById('colorPicker');
        const newColorSample = document.getElementById('newColorSample');
        const newColorRgb = document.getElementById('newColorRgb');
        const replaceBtn = document.getElementById('replaceBtn');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const infoMessage = document.getElementById('infoMessage');
        const alphaSlider = document.getElementById('alphaSlider');
        const alphaValue = document.getElementById('alphaValue');
        const transparentBtn = document.getElementById('transparentBtn');
        const chainModeToggle = document.getElementById('chainModeToggle');

        let selectedColor = null;
        let currentImage = null;
        let pinPosition = null;
        let currentReplaceMode = 'all';
        let canvasBackup = null;

        // メッセージ更新関数（アニメーション付き）
        function updateMessage(text) {
            infoMessage.classList.remove('animate-slide-up');
            infoMessage.textContent = text;
            setTimeout(() => {
                infoMessage.classList.add('animate-slide-up');
            }, 10);
        }

        // モードトグル UI 更新
        function updateModeIndicators() {
            const pinCircle = document.getElementById('pinModeIndicator').querySelector('circle');
            const chainCircle = document.getElementById('chainModeIndicator').querySelector('circle');
            const pinStatus = document.getElementById('pinModeStatus');

            if (currentReplaceMode === 'pin') {
                pinCircle.setAttribute('fill', 'rgba(0, 135, 196, 0.7)');
            } else {
                pinCircle.setAttribute('fill', 'white');
            }

            if (chainModeToggle.checked) {
                chainCircle.setAttribute('fill', 'rgba(0, 135, 196, 0.7)');
            } else {
                chainCircle.setAttribute('fill', 'white');
            }

            pinStatus.textContent = pinPosition ? `(${pinPosition.x}, ${pinPosition.y})` : '';

            // モードメッセージの表示制御
            updateModeMessage();
        }

        function updateModeMessage() {
            const messages = [];
            if (currentReplaceMode === 'pin') {
                messages.push('ピンモード ON');
            }
            if (chainModeToggle.checked) {
                messages.push('連鎖モード ON');
            }
            if (messages.length > 0) {
                infoMessage.textContent = messages.join(' / ');
                infoMessage.style.display = '';
            } else {
                infoMessage.textContent = '';
                infoMessage.style.display = 'none';
            }
        }

        function togglePinMode() {
            if (currentReplaceMode === 'pin') {
                currentReplaceMode = 'all';
                pinPosition = null;
                removePinMarker();
                document.getElementById('pinInfo').textContent = 'ピン未配置';
            } else {
                currentReplaceMode = 'pin';
            }
            updateModeIndicators();
        }

        function toggleChainMode() {
            chainModeToggle.checked = !chainModeToggle.checked;
            updateModeIndicators();
        }

        function toggleSettingsPanel() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        document.getElementById('boundaryThreshold').addEventListener('input', function() {
            document.getElementById('thresholdValue').textContent = this.value;
        });

        // ピンマーカーの色を決定（赤っぽい色のときはシアンにする）
        function getPinMarkerColor(pixelColor) {
            if (!pixelColor) return 'red';
            const { r, g, b } = pixelColor;
            // 赤っぽい色: Rが高く、GとBが低い
            if (r > 150 && g < 100 && b < 100) {
                return 'cyan';
            }
            return 'red';
        }

        // ピンマーカー描画
        function drawPinMarker(x, y) {
            canvasBackup = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const markerColor = getPinMarkerColor(selectedColor);
            ctx.strokeStyle = markerColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x - 12, y);
            ctx.lineTo(x + 12, y);
            ctx.moveTo(x, y - 12);
            ctx.lineTo(x, y + 12);
            ctx.stroke();
        }

        function removePinMarker() {
            if (canvasBackup) {
                ctx.putImageData(canvasBackup, 0, 0);
                canvasBackup = null;
            }
        }

        // Flood Fill (BFS)
        function floodFillReplace(startX, startY, targetColor, newColor, newAlpha, boundaryThreshold) {
            removePinMarker();
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const width = canvas.width;
            const height = canvas.height;
            const visited = new Uint8Array(width * height);
            const queue = [];
            let qHead = 0;
            let replacedCount = 0;

            const startIdx = startY * width + startX;
            queue.push(startIdx);
            visited[startIdx] = 1;

            while (qHead < queue.length) {
                const pos = queue[qHead++];
                const cx = pos % width;
                const cy = (pos / width) | 0;
                const idx = pos * 4;

                const pr = data[idx];
                const pg = data[idx + 1];
                const pb = data[idx + 2];

                if (isSimilarColor(pr, pg, pb, targetColor, 5)) {
                    data[idx] = newColor.r;
                    data[idx + 1] = newColor.g;
                    data[idx + 2] = newColor.b;
                    data[idx + 3] = newAlpha;
                    replacedCount++;
                }

                const neighbors = [cx - 1, cy, cx + 1, cy, cx, cy - 1, cx, cy + 1];
                for (let n = 0; n < 8; n += 2) {
                    const nx = neighbors[n];
                    const ny = neighbors[n + 1];
                    if (nx < 0 || nx >= width || ny < 0 || ny >= height) continue;
                    const nIdx = ny * width + nx;
                    if (visited[nIdx]) continue;
                    visited[nIdx] = 1;

                    const ni = nIdx * 4;
                    const dr = data[ni] - targetColor.r;
                    const dg = data[ni + 1] - targetColor.g;
                    const db = data[ni + 2] - targetColor.b;
                    const distance = Math.sqrt(dr * dr + dg * dg + db * db);

                    if (distance > boundaryThreshold) continue;
                    queue.push(nIdx);
                }
            }

            ctx.putImageData(imageData, 0, 0);
            return replacedCount;
        }

        // Flood Fill 透過化 (BFS)
        function floodFillTransparent(startX, startY, targetColor, boundaryThreshold) {
            removePinMarker();
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const width = canvas.width;
            const height = canvas.height;
            const visited = new Uint8Array(width * height);
            const queue = [];
            let qHead = 0;
            let replacedCount = 0;

            const startIdx = startY * width + startX;
            queue.push(startIdx);
            visited[startIdx] = 1;

            while (qHead < queue.length) {
                const pos = queue[qHead++];
                const cx = pos % width;
                const cy = (pos / width) | 0;
                const idx = pos * 4;

                if (isSimilarColor(data[idx], data[idx + 1], data[idx + 2], targetColor, 5)) {
                    data[idx + 3] = 0;
                    replacedCount++;
                }

                const neighbors = [cx - 1, cy, cx + 1, cy, cx, cy - 1, cx, cy + 1];
                for (let n = 0; n < 8; n += 2) {
                    const nx = neighbors[n];
                    const ny = neighbors[n + 1];
                    if (nx < 0 || nx >= width || ny < 0 || ny >= height) continue;
                    const nIdx = ny * width + nx;
                    if (visited[nIdx]) continue;
                    visited[nIdx] = 1;

                    const ni = nIdx * 4;
                    const dr = data[ni] - targetColor.r;
                    const dg = data[ni + 1] - targetColor.g;
                    const db = data[ni + 2] - targetColor.b;
                    const distance = Math.sqrt(dr * dr + dg * dg + db * db);

                    if (distance > boundaryThreshold) continue;
                    queue.push(nIdx);
                }
            }

            ctx.putImageData(imageData, 0, 0);
            return replacedCount;
        }

        // 画像読み込み
        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            // ファイル形式チェック
            if (!file.type.match('image/(png|jpeg|jpg)')) {
                alert('PNG または JPEG/JPG 形式の画像を選択してください。');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Canvas のサイズを画像に合わせる
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    // UI更新（アニメーション付き）
                    placeholderText.style.display = 'none';
                    canvas.style.display = 'block';
                    canvas.classList.add('animate-fade-in');
                    copyBtn.disabled = false;
                    downloadBtn.disabled = false;
                    updateMessage('画像上の任意の場所をクリックして、置換したい色を選択してください');

                    currentImage = img;
                };
                img.onerror = function() {
                    alert('画像の読み込みに失敗しました。');
                };
                img.src = e.target.result;
            };
            reader.onerror = function() {
                alert('ファイルの読み込みに失敗しました。');
            };
            reader.readAsDataURL(file);
        });

        // Canvas クリックでカラー取得
        canvas.addEventListener('click', function(event) {
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            // Canvas座標を元画像の座標に変換
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const pixelX = Math.floor(x * scaleX);
            const pixelY = Math.floor(y * scaleY);

            // ピクセル色を取得（ピンマーカーを一旦除去してから）
            removePinMarker();
            const imageData = ctx.getImageData(pixelX, pixelY, 1, 1);
            const data = imageData.data;
            const r = data[0];
            const g = data[1];
            const b = data[2];
            const a = data[3];

            // 選択した色を保存
            selectedColor = { r, g, b, a };

            // UI更新
            const hexColor = rgbToHex(r, g, b);
            selectedColorSample.style.background = hexColor;
            selectedColorHex.textContent = hexColor;
            selectedColorRgb.textContent = `RGB(${r}, ${g}, ${b})`;

            // 置換ボタンを有効化
            replaceBtn.disabled = false;
            transparentBtn.disabled = false;

            if (currentReplaceMode === 'pin') {
                pinPosition = { x: pixelX, y: pixelY };
                document.getElementById('pinInfo').textContent = `ピン位置: (${pixelX}, ${pixelY}) - 色: ${hexColor}`;
                drawPinMarker(pixelX, pixelY);
                updateModeIndicators();
            }
        });

        // プレビュー更新関数（透明度を反映）
        function updateColorPreview() {
            const hex = newColorInput.value.trim();
            if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
                const rgb = hexToRgb(hex);
                const alpha = parseInt(alphaSlider.value) / 255;
                newColorSample.style.background = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha})`;
                newColorRgb.textContent = `RGB(${rgb.r}, ${rgb.g}, ${rgb.b})`;
            }
        }

        // カラーピッカーと入力フィールドの同期
        colorPicker.addEventListener('input', function() {
            newColorInput.value = colorPicker.value.toUpperCase();
            updateColorPreview();
        });

        newColorInput.addEventListener('input', function() {
            const hex = newColorInput.value.trim();
            if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
                colorPicker.value = hex;
                updateColorPreview();
            }
        });

        // Alphaスライダーの更新
        alphaSlider.addEventListener('input', function() {
            const alpha = parseInt(alphaSlider.value);
            const percentage = Math.round((alpha / 255) * 100);
            if (alpha === 255) {
                alphaValue.textContent = '255 (不透明)';
            } else if (alpha === 0) {
                alphaValue.textContent = '0 (完全透明)';
            } else {
                alphaValue.textContent = `${alpha} (${percentage}%)`;
            }
            updateColorPreview();
        });

        // RGB → Hex 変換
        function rgbToHex(r, g, b) {
            return '#' + [r, g, b]
                .map(x => x.toString(16).padStart(2, '0').toUpperCase())
                .join('');
        }

        // Hex → RGB 変換
        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        // 類似色チェック関数 (RGB値が±5以内)
        function isSimilarColor(r, g, b, targetColor, tolerance = 5) {
            return Math.abs(r - targetColor.r) <= tolerance &&
                   Math.abs(g - targetColor.g) <= tolerance &&
                   Math.abs(b - targetColor.b) <= tolerance;
        }

        // カラー置換
        function replaceColor() {
            if (!selectedColor) {
                alert('先に画像上の色をクリックして選択してください。');
                return;
            }

            const newColorHex = newColorInput.value.trim();
            if (!/^#[0-9A-Fa-f]{6}$/.test(newColorHex)) {
                alert('正しい16進数カラーコード (#RRGGBB) を入力してください。');
                return;
            }

            const newColor = hexToRgb(newColorHex);
            const newAlpha = parseInt(alphaSlider.value);

            // 処理中メッセージ
            updateMessage('処理中...');
            replaceBtn.disabled = true;

            // 非同期処理で UI をブロックしない
            setTimeout(() => {
                let replacedCount;

                if (currentReplaceMode === 'pin') {
                    if (!pinPosition) {
                        alert('ピンモードではピンを配置してから置換してください。');
                        replaceBtn.disabled = false;
                        return;
                    }
                    const threshold = parseInt(document.getElementById('boundaryThreshold').value);
                    replacedCount = floodFillReplace(pinPosition.x, pinPosition.y, selectedColor, newColor, newAlpha, threshold);
                } else {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    replacedCount = 0;

                    for (let i = 0; i < data.length; i += 4) {
                        if (isSimilarColor(data[i], data[i + 1], data[i + 2], selectedColor, 5)) {
                            data[i] = newColor.r;
                            data[i + 1] = newColor.g;
                            data[i + 2] = newColor.b;
                            data[i + 3] = newAlpha;
                            replacedCount++;
                        }
                    }

                    ctx.putImageData(imageData, 0, 0);
                }

                // 連鎖変換モード: selectedColor を新しい色に更新
                if (chainModeToggle.checked && replacedCount > 0) {
                    selectedColor = { r: newColor.r, g: newColor.g, b: newColor.b, a: newAlpha };
                    const hexColor = rgbToHex(newColor.r, newColor.g, newColor.b);
                    selectedColorSample.style.background = hexColor;
                    selectedColorHex.textContent = hexColor;
                    selectedColorRgb.textContent = `RGB(${newColor.r}, ${newColor.g}, ${newColor.b})`;
                }

                // 完了メッセージ
                updateMessage(`置換完了! ${replacedCount.toLocaleString()} ピクセルを置換しました。`);
                replaceBtn.disabled = false;

                if (replacedCount === 0) {
                    alert('指定した色と類似するピクセルが見つかりませんでした。');
                }

                // ピンモードならマーカーを再描画
                if (currentReplaceMode === 'pin' && pinPosition) {
                    drawPinMarker(pinPosition.x, pinPosition.y);
                }
            }, 100);
        }

        // 透過化
        function makeTransparent() {
            if (!selectedColor) {
                alert('先に画像上の色をクリックして選択してください。');
                return;
            }

            updateMessage('処理中...');
            transparentBtn.disabled = true;

            setTimeout(() => {
                let replacedCount;

                if (currentReplaceMode === 'pin') {
                    if (!pinPosition) {
                        alert('ピンモードではピンを配置してから透過化してください。');
                        transparentBtn.disabled = false;
                        return;
                    }
                    const threshold = parseInt(document.getElementById('boundaryThreshold').value);
                    replacedCount = floodFillTransparent(pinPosition.x, pinPosition.y, selectedColor, threshold);
                } else {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    replacedCount = 0;

                    for (let i = 0; i < data.length; i += 4) {
                        if (isSimilarColor(data[i], data[i + 1], data[i + 2], selectedColor, 5)) {
                            data[i + 3] = 0;
                            replacedCount++;
                        }
                    }

                    ctx.putImageData(imageData, 0, 0);
                }

                updateMessage(`透過化完了! ${replacedCount.toLocaleString()} ピクセルを透過にしました。`);
                transparentBtn.disabled = false;

                if (replacedCount === 0) {
                    alert('指定した色と類似するピクセルが見つかりませんでした。');
                }

                if (currentReplaceMode === 'pin' && pinPosition) {
                    drawPinMarker(pinPosition.x, pinPosition.y);
                }
            }, 100);
        }

        // クリップボードにコピー
        async function copyToClipboard() {
            try {
                removePinMarker();
                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        alert('画像のコピーに失敗しました。');
                        return;
                    }

                    try {
                        // Clipboard APIを使用してコピー
                        await navigator.clipboard.write([
                            new ClipboardItem({
                                'image/png': blob
                            })
                        ]);
                        updateMessage('画像をクリップボードにコピーしました!');
                        if (currentReplaceMode === 'pin' && pinPosition) drawPinMarker(pinPosition.x, pinPosition.y);
                    } catch (err) {
                        console.error('クリップボードへのコピーに失敗:', err);
                        alert('クリップボードへのコピーに失敗しました。ブラウザがこの機能をサポートしていない可能性があります。');
                    }
                }, 'image/png');
            } catch (err) {
                console.error('エラー:', err);
                alert('画像のコピーに失敗しました。');
            }
        }

        // 画像ダウンロード
        function downloadImage() {
            removePinMarker();
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'replaced_image.png';
                a.click();
                URL.revokeObjectURL(url);
                updateMessage('画像をダウンロードしました!');
                if (currentReplaceMode === 'pin' && pinPosition) drawPinMarker(pinPosition.x, pinPosition.y);
            }, 'image/png');
        }

        // 初期状態のインジケーター更新
        updateModeIndicators();
    </script>
</body>
</html>
